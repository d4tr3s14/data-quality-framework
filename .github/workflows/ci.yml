name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python data/generate_synthetic_data.py

      - name: Run BDD validation suite
        run: behave -f allure_behave.formatter:AllureFormatter -o allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-evidence
          path: reports/pdf

  # ---------------------------------------------------------------------
  # Publica el reporte Allure navegable en GitHub Pages (solo push a main).
  # ---------------------------------------------------------------------
  publish-report:
    name: Publish Allure report
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Restore Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report (con histórico)
        run: |
          npm install -g allure-commandline
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          allure generate allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
